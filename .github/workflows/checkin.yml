name: 🟢 Auto CHECK IN

on:
  # schedule:
    # Senin-Kamis & Sabtu: jam 07:00 WIB = 00:00 UTC
    # - cron: '0 0 * * 1,2,3,4,6'
    # Jumat: jam 06:45 WIB = 23:45 UTC hari sebelumnya
    # - cron: '45 23 * * 4'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⏰ Waktu Jakarta
        run: |
          echo "UTC: $(date -u)"
          echo "WIB: $(TZ='Asia/Jakarta' date)"

      - name: 🚀 Execute CHECK IN
        run: node scripts/absensi.js checkin

      - name: 💾 Save Log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add log.json || true
          git diff --staged --quiet || git commit -m "📝 Auto CHECK IN - $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M WIB')"
          git push || true
