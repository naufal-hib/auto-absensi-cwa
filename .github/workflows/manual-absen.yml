name: 👆 Manual Absen (Sekarang)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Check In atau Check Out?'
        required: true
        type: choice
        options:
          - checkin
          - checkout
      jam_override:
        description: 'Jam absen HH:MM:SS (kosong = jam sekarang)'
        required: false
        default: ''

jobs:
  manual-absen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⏰ Waktu Jakarta
        run: |
          echo "UTC: $(date -u)"
          echo "WIB: $(TZ='Asia/Jakarta' date)"
          echo "Action: ${{ github.event.inputs.action }}"
          echo "Jam: ${{ github.event.inputs.jam_override }}"

      - name: 👆 Execute Manual Absen
        env:
          MANUAL_MODE: 'true'
          JAM_OVERRIDE: ${{ github.event.inputs.jam_override }}
        run: node scripts/absensi.js ${{ github.event.inputs.action }}

      - name: 💾 Save Log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add log.json || true
          git diff --staged --quiet || git commit -m "👆 Manual ${{ github.event.inputs.action }} - $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M WIB')"
          git push || true
