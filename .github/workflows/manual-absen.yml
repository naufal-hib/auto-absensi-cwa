name: 👆 Manual Absen (Sekarang)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Check In atau Check Out?'
        required: true
        type: choice
        options:
          - checkin
          - checkout
      jam_override:
        description: 'Jam absen (HH:MM:SS) - kosongkan = pakai jam sekarang'
        required: false
        default: ''

jobs:
  manual-absen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⏰ Show Current Time (Jakarta)
        run: |
          echo "UTC Time: $(date -u)"
          echo "Jakarta Time: $(TZ='Asia/Jakarta' date)"
          echo "Action: ${{ github.event.inputs.action }}"
          echo "Jam Override: ${{ github.event.inputs.jam_override }}"

      - name: 👆 Execute Manual Absen
        env:
          ABSEN_NIK: ${{ secrets.ABSEN_NIK }}
          ABSEN_PASSWORD: ${{ secrets.ABSEN_PASSWORD }}
          ABSEN_SHIFT: ${{ secrets.ABSEN_SHIFT }}
          JAM_OVERRIDE: ${{ github.event.inputs.jam_override }}
          MANUAL_MODE: 'true'
        run: node scripts/absensi.js ${{ github.event.inputs.action }}

      - name: 💾 Save Log to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add log.json || true
          git diff --staged --quiet || git commit -m "👆 Manual ${{ github.event.inputs.action }} - $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M:%S WIB')"
          git push || true
