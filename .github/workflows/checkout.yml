name: 🔴 Auto CHECK OUT

on:
  # schedule:
    # Senin-Jumat: jam 16:20 WIB = 09:20 UTC
    # - cron: '20 9 * * 1,2,3,4,5'
    # Sabtu: jam 13:20 WIB = 06:20 UTC
    # - cron: '20 6 * * 6'
  workflow_dispatch:

jobs:
  checkout-absen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⏰ Waktu Jakarta
        run: |
          echo "UTC: $(date -u)"
          echo "WIB: $(TZ='Asia/Jakarta' date)"

      - name: 🚀 Execute CHECK OUT
        run: node scripts/absensi.js checkout

      - name: 💾 Save Log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add log.json || true
          git diff --staged --quiet || git commit -m "📝 Auto CHECK OUT - $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M WIB')"
          git push || true
